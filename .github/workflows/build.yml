name: Build IMF Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install UPX
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get install -y upx
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            brew install upx
          else
            choco install upx
          fi

      - name: Build Application
        run: |
          cd browser/src-tauri
          cargo build --release

      - name: Compress Binary with UPX
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            upx --best browser/src-tauri/target/release/imf-browser.exe
          else
            upx --best browser/src-tauri/target/release/imf-browser
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: imf-browser-${{ matrix.os }}
          path: |
            browser/src-tauri/target/release/imf-browser*

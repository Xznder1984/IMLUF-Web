name: Build IMF Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Tauri Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Application
        shell: bash
        run: |
          cd browser
          cargo tauri build

      - name: Install UPX
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get install -y upx
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            brew install upx
          else
            choco install upx
          fi

      - name: Compress Binary with UPX
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            upx --best browser/src-tauri/target/release/imf-browser.exe
          else
            upx --best browser/src-tauri/target/release/imf-browser
          fi

      - name: Generate Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: |
          choco install innosetup
          iscc browser/inno_setup_script.iss

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imf-browser-${{ matrix.os }}
          path: |
            browser/src-tauri/target/release/bundle/
            browser/IMFBrowserSetup.exe
            browser/src-tauri/target/release/imf-browser*
